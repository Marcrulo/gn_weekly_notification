name: AI-fred's weekly newsletter

# The real thing: everyone in recipients.txt. Same steps as test-send.yml; the
# only differences are who it goes to, the Sunday schedule, and that what was
# sent is recorded in history.json so it never repeats.
on:
  schedule:
    # Sunday 23:05 Danish time. GitHub's cron is UTC only, and Denmark is UTC+2
    # in summer and UTC+1 in winter, so both are scheduled and the `timing` job
    # below lets through only the one that is 23:05 in Copenhagen that day.
    # Five past rather than on the hour: GitHub can drop scheduled jobs at peak
    # times, and the top of every hour is peak.
    - cron: "5 21 * * 0"  # 23:05 CEST (summer)
    - cron: "5 22 * * 0"  # 23:05 CET (winter)
  # Run by hand = a real send to the whole list (e.g. after a missed Sunday).
  # To try something out, run test-send.yml instead.
  workflow_dispatch:

env:
  # Kept here rather than in llm.py so the model can be swapped without
  # touching code. llm.py reads OLLAMA_MODEL and falls back to the same value.
  OLLAMA_MODEL: "MobiusDevelopment/Bonsai-27B-Q1_0-gguf"

jobs:
  # Picks the right one of the two schedules. Decided by which cron fired, not
  # by the clock, so a run GitHub starts late is still judged correctly. The DST
  # switch happens at 02:00-03:00 on a Sunday, long before 23:05, so the offset
  # read here is the one in force that evening.
  timing:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -z "$SCHEDULE" ]; then
            echo "Manual run: go."; echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          offset=$(TZ=Europe/Copenhagen date +%z)   # +0200 summer, +0100 winter
          if { [ "$offset" = "+0200" ] && [ "$SCHEDULE" = "5 21 * * 0" ]; } ||
             { [ "$offset" = "+0100" ] && [ "$SCHEDULE" = "5 22 * * 0" ]; }; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "Copenhagen is UTC$offset; '$SCHEDULE' is not 23:05 there - skipping."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

  send:
    needs: timing
    if: ${{ needs.timing.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    # Write access so the job can commit history.json (what was already sent)
    # back to the repo after the send.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests

      # --- Local model -----------------------------------------------------
      # AI-fred's words are written fresh each week by a model running on this
      # runner; llm.py talks to it over localhost, no key needed. If any of
      # this fails, the newsletter still goes out with his template words.
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          # The installer registers a systemd service that runs as the `ollama`
          # user and keeps weights in /usr/share/ollama - which would hold port
          # 11434 and quietly bypass the cache below. Run our own server as the
          # runner user instead, so OLLAMA_MODELS is the path we cache.
          sudo systemctl stop ollama 2>/dev/null || true
          sudo systemctl disable ollama 2>/dev/null || true

      # ~4.4GB of weights (Bonsai 27B, 1-bit). GitHub evicts caches after 7 days
      # without a hit and this runs every 7 days, so expect the occasional miss
      # - it just falls back to pulling.
      - name: Cache the model
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ env.OLLAMA_MODEL }}

      - name: Start Ollama and load the model
        run: |
          export OLLAMA_MODELS="$HOME/.ollama/models"
          # nohup so the server outlives this step's shell - later steps need it.
          nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          # Poll rather than sleep blindly: usually up in ~1s, but a cold runner
          # can take longer.
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:11434/api/tags >/dev/null \
            || { echo "Ollama did not come up"; exit 1; }
          ollama pull "$OLLAMA_MODEL"
          # Fail loudly rather than quietly mail template words because the
          # weights never arrived.
          ollama list | grep -q "$OLLAMA_MODEL" \
            || { echo "$OLLAMA_MODEL is not available"; exit 1; }
      # ---------------------------------------------------------------------

      # One step builds and sends, so the issue printed in the log is exactly
      # the one that was mailed. Timed, so the log shows how long it took.
      - name: Build and send to everyone in recipients.txt
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: time python notify.py

      # If AI-fred fell back to his template words, this shows why.
      - name: Ollama log
        if: always()
        run: tail -n 50 "$RUNNER_TEMP/ollama.log" || true

      # notify.py appended this week's joke id, paper ids and xkcd number to
      # history.json; commit it so next week skips them.
      - name: Remember what was sent
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet && exit 0
          git commit -m "Record the newsletter sent $(date -u +%F)"
          git push
