name: AI-fred's weekly newsletter

on:
  schedule:
    # 15:23 UTC every Sunday (17:23 Danish summer time, 16:23 in winter).
    # Deliberately not on the hour: GitHub queues scheduled jobs on shared
    # capacity and can drop them outright at peak times, which is the start of
    # every hour.
    - cron: "23 15 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the newsletter in the log instead of sending it"
        type: boolean
        default: true
      to:
        description: "Test: send only to this address (leave empty for the whole list)"
        default: ""

env:
  # Kept here rather than in llm.py so the model can be swapped without
  # touching code. llm.py reads OLLAMA_MODEL and falls back to the same value.
  OLLAMA_MODEL: "qwen3.5:9b"

jobs:
  send:
    runs-on: ubuntu-latest
    # Write access so the job can commit history.json (what was already sent)
    # back to the repo after a real send.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests

      # --- Local model -----------------------------------------------------
      # AI-fred's greeting, letter and farewell are written fresh each week by
      # a model running on this runner. Nothing here needs a key: llm.py talks
      # to it over localhost. If any of this fails, the newsletter still goes
      # out with AI-fred's template words.
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          # The installer registers a systemd service that runs as the `ollama`
          # user and keeps weights in /usr/share/ollama - which would hold port
          # 11434 and quietly bypass the cache below. Run our own server as the
          # runner user instead, so OLLAMA_MODELS is the path we cache.
          sudo systemctl stop ollama 2>/dev/null || true
          sudo systemctl disable ollama 2>/dev/null || true

      # ~7.6GB of weights. Restoring beats re-downloading, but GitHub evicts
      # caches after 7 days of no access and this job runs every 7 days, so
      # expect an occasional miss - it just falls back to pulling.
      - name: Cache the model
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ env.OLLAMA_MODEL }}

      - name: Start Ollama and load the model
        run: |
          export OLLAMA_MODELS="$HOME/.ollama/models"
          # nohup so the server outlives this step's shell - later steps need it.
          nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          # Poll rather than sleep blindly: the server is usually up in ~1s,
          # but a cold runner can take longer and a fixed sleep would either
          # waste time or flake.
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:11434/api/tags >/dev/null \
            || { echo "Ollama did not come up"; exit 1; }
          ollama pull "$OLLAMA_MODEL"
          # Fail loudly here rather than quietly mail template words because
          # the weights never arrived.
          ollama list | grep -q "$OLLAMA_MODEL" \
            || { echo "$OLLAMA_MODEL is not available"; exit 1; }
      # ---------------------------------------------------------------------

      # One step builds and sends, so the issue printed in the log is exactly
      # the one that was mailed (the comic is random, the letter is sampled).
      # Server and mailing list live in the repo (notify.py, recipients.txt).
      # The app password is the only secret.
      - name: Build and send
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
          TO: ${{ inputs.to }}
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ -n "$TO" ]; then args+=(--to "$TO"); fi
          python notify.py "${args[@]}"

      # notify.py appended this week's joke id, paper ids and xkcd number to
      # history.json (only on a send to the whole list); commit it so next
      # week skips them. Without this the newsletter would repeat itself.
      - name: Remember what was sent
        # On the schedule `inputs` is empty, so both are falsy and this runs.
        if: ${{ !inputs.dry_run && !inputs.to }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet && exit 0
          git commit -m "Record the newsletter sent $(date -u +%F)"
          git push
